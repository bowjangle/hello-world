name: Build Android APK

on:
  push:
    paths: ["PrayerTracker/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PrayerTracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: chmod +x gradlew && ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: salah-tracker-apk
          path: PrayerTracker/app/build/outputs/apk/debug/app-debug.apk
